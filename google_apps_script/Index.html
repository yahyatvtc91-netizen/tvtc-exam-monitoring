<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Tahoma,Arial,sans-serif;background:#f3f7fb;color:#172033;margin:0;padding:24px}.panel{max-width:900px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 24px #17365d16}h1{color:#17365d;font-size:24px}form{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:12px;border-radius:8px}input{border:1px solid #bbc8d8;flex:1;min-width:180px}button{border:0;color:#fff;background:#0f6b78;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border-bottom:1px solid #d8e1ed;text-align:right;padding:10px}th{background:#eaf1f8}.wrap{overflow:auto}.muted{color:#64748b}
</style></head><body><main class="panel"><h1>جدول مراقبات المدرب</h1><p class="muted">أدخل الرقم الوظيفي لعرض المراقبات المنشورة. آخر تحديث للبيانات يعتمد على رفع منسق الجدول.</p><form id="lookup"><input id="employeeId" inputmode="numeric" autocomplete="off" placeholder="الرقم الوظيفي" aria-label="الرقم الوظيفي" required><button type="submit">عرض جدولي</button></form><p id="message" role="status"></p><h2 id="trainerName"></h2><div class="wrap"><table id="result" hidden><thead><tr><th>القسم</th><th>اليوم</th><th>التاريخ</th><th>الفترة</th><th>الوقت</th><th>المقرر</th><th>الشعبة</th><th>القاعة</th></tr></thead><tbody></tbody></table></div></main><script>
const form=document.getElementById('lookup'),message=document.getElementById('message'),table=document.getElementById('result'),body=table.querySelector('tbody');
form.addEventListener('submit',event=>{event.preventDefault();message.textContent='جارٍ البحث…';table.hidden=true;body.replaceChildren();document.getElementById('trainerName').textContent='';
  google.script.run.withSuccessHandler(result=>{message.textContent=result.rows.length?'': 'لا توجد مراقبات منشورة لهذا الرقم.';if(!result.rows.length)return;document.getElementById('trainerName').textContent=result.name;
    result.rows.forEach(row=>{const tr=document.createElement('tr');row.forEach((value,index)=>{const td=document.createElement('td');td.textContent=value;if(index===2)td.dir='ltr';tr.appendChild(td)});body.appendChild(tr)});table.hidden=false;
  }).withFailureHandler(error=>{message.textContent=error.message||'تعذر تحميل البيانات.'}).getSchedule(document.getElementById('employeeId').value);
});
</script></body></html>
